[project]
name = "marl"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.10"
dependencies = [
    "cloudpickle>=3.1.2",
    "fire>=0.7.1",
    "ipdb>=0.13.13",
    "loguru>=0.7.3",
    "matplotlib>=3.10.9",
    "moviepy>=2.2.1",
    "numpy>=2.2.6",
    "opencv-python>=5.0.0.93",
    "pandas>=2.3.3",
    "plotly>=7.1.0",
    "tensorboard>=2.21.0",
    "torch>=2.7.0",
    "torchvision>=0.22.1",
    "tqdm>=4.70.1",
]


[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true


[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true


[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }
torchaudio = { index = "pytorch-cu118" }
