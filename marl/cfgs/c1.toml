####################################
# based: c0.toml
# target: support 'stay'
# -----------------------------------------
# training.target_range_steps: [1] -> [30, 10,5]
# max_steps: 300 -> 6000
# num_episode: 5000 -> 100

face_size = 512
rf_size = 64
num_episode = 100
history_len = 2 #5
max_steps = 6000

batch_size = 64
reward_scale = 10.0

actions = [[5,0], [-5,0], [0,5], [0,-5], [0,0]]

dataset_size_max = 2

random_init_xy = false

update_steps = 30

shared_patch_encoder = false # 共享版本可能有个bug: 同一份参数被多个独立而optimizer分次更新

target_update_freq = 5

agent_action_selection_mode = "bfs" # dfs


[env]
use_abs_dist_as_reward = false

[training]
freezing_success_agent = true 
target_range_steps = [30,10,5]