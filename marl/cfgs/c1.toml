####################################
# based: c0.toml
# target: support 'stay'
# -----------------------------------------
# training.target_range_steps: [1] -> [30, 10,5]
# max_steps: 300 -> 6000
# num_episode: 5000 -> 100

[env]
face_size = 512
rf_size = 64
max_steps = 200
#dataset_size_max = 300
history_len = 2 #5
reward_scale = 100.0
use_abs_dist_as_reward = false
use_global_view = true
target_range_steps = [20,15,10,8]

[agent]
actions = [[2,0], [-2,0], [0,2], [0,-2], [0,0]]

shared_patch_encoder = true # 共享编码器
xy_init_method = "heatmap"  # random / fixed
use_double_dqn = true

action_selection_mode = "bfs" # dfs

[training]
batch_size = 64
update_steps = 30
target_update_freq = 4
freezing_success_agent = true 
seed = 42
num_loop = 5000 # 应该不低于 dataset_size_max
loss = "huber" # huber, mse
num_samples_to_enable_training = 100


